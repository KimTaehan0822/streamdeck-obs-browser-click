<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
	<!-- OBS Browser Click: a browser window whose button is being clicked. Source for imgs/plugin*.png. -->
	<rect x="8" y="8" width="240" height="240" rx="52" fill="#18222D"/>
	<!-- window -->
	<rect x="38" y="52" width="164" height="132" rx="16" fill="#243241" stroke="#EEF3F7" stroke-width="10"/>
	<path d="M38 68a16 16 0 0 1 16-16h132a16 16 0 0 1 16 16v20H38z" fill="#EEF3F7"/>
	<circle cx="60" cy="71" r="5.5" fill="#18222D"/>
	<circle cx="78" cy="71" r="5.5" fill="#18222D"/>
	<circle cx="96" cy="71" r="5.5" fill="#18222D"/>
	<rect x="112" y="64" width="74" height="13" rx="6.5" fill="#18222D" opacity=".35"/>
	<!-- the button on the page -->
	<rect x="60" y="112" width="96" height="40" rx="20" fill="#0CC5FE"/>
	<!-- click burst -->
	<g stroke="#FFC93C" stroke-width="9" stroke-linecap="round">
		<path d="M150 106l-9-12"/>
		<path d="M128 100v-15"/>
		<path d="M170 122h14"/>
	</g>
	<!-- cursor, tip on the button -->
	<path d="M136 126v86l23-21 17 38 18-8-17-37h32z" fill="#FFFFFF" stroke="#18222D" stroke-width="9" stroke-linejoin="round"/>
</svg>
