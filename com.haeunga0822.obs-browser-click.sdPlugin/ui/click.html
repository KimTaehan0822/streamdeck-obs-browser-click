<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
</head>
<body>
	<style>
		.hint { color: #969696; font-size: 8pt; padding: 0 0 8px 0; }
		.tb-btn { background: #3d3d3d; color: #d8d8d8; border: none; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
		.tb-btn:hover, .tb-btn:focus-visible { background: #4a4a4a; }
		.notice { color: #f0c040; font-size: 8pt; padding: 0 0 8px 0; line-height: 1.4; }
		.shot { position: relative; margin: 0 0 8px 0; cursor: crosshair; }
		.shot img { display: block; width: 100%; border: 1px solid #3d3d3d; }
		.shot .dot { position: absolute; width: 10px; height: 10px; margin: -6px 0 0 -6px; border: 1px solid #fff; border-radius: 50%; background: #ff3b3b; pointer-events: none; }
		[hidden] { display: none !important; }
	</style>
	<div id="fields"></div>
	<hr />
	<sdpi-item label="디버깅 포트"><sdpi-textfield setting="port" global placeholder="9222" pattern="^[0-9]{0,5}$"></sdpi-textfield></sdpi-item>
	<div class="hint">OBS를 --remote-debugging-port=9222 옵션으로 켜야 동작합니다.</div>
	<sdpi-item label=""><button type="button" class="tb-btn" id="shortcut">OBS 바로가기 설정</button></sdpi-item>
	<div class="hint" id="shortcut-status" role="status">바탕화면과 시작 메뉴에 디버깅 옵션이 붙은 OBS 바로가기를 만들어요.</div>
	<script>
		// One page for both actions; the action UUID picks the fields. Lists come from the plugin (src/plugin.ts).
		const REMOTE = `
			<sdpi-item label="동작"><sdpi-select setting="preset" datasource="getPresets" placeholder="고르세요"></sdpi-select></sdpi-item>
			<div class="hint">OBS에 해당 리모컨이 사용자 지정 독이나 브라우저 소스로 열려 있어야 합니다.</div>`
		const CUSTOM = `
			<sdpi-item label="페이지"><sdpi-select id="page" setting="pageUrl" datasource="getPages" hot-reload placeholder="OBS에 열린 페이지"></sdpi-select></sdpi-item>
			<sdpi-item label=""><button type="button" class="tb-btn" id="reload">목록 새로고침</button></sdpi-item>
			<sdpi-item label="방식"><sdpi-select id="mode" setting="mode" default="button"><option value="button">버튼으로 찾기</option><option value="point">위치 찍기</option></sdpi-select></sdpi-item>
			<div id="by-button">
				<sdpi-item label="버튼"><sdpi-select id="button" setting="button" datasource="getButtons" hot-reload placeholder="페이지를 먼저 고르세요"></sdpi-select></sdpi-item>
				<sdpi-item label="CSS 선택자"><sdpi-textfield setting="selector" placeholder="비우면 위에서 고른 버튼"></sdpi-textfield></sdpi-item>
				<div class="hint">글자가 없는 아이콘 버튼은 CSS 선택자로 지정하세요.</div>
			</div>
			<div id="by-point" hidden>
				<sdpi-item label=""><button type="button" class="tb-btn" id="shoot">화면 불러오기</button> <button type="button" class="tb-btn" id="restore">스크롤 되돌리기</button></sdpi-item>
				<sdpi-item label="스크롤"><sdpi-checkbox setting="scrollRestore" default="true" label="스크롤이 바뀌면 키로 되돌리기"></sdpi-checkbox></sdpi-item>
				<div class="notice">독이나 브라우저 소스의 크기를 바꾸면 같은 좌표가 다른 곳을 누를 수 있어요. 크기를 바꾼 뒤에는 꼭 [화면 불러오기]로 위치를 다시 찍어 주세요. 페이지를 스크롤하면 키에 '스크롤 바뀜'이 떠요. 키를 한 번 누르거나 [스크롤 되돌리기]를 누르면 찍을 때의 스크롤로 돌아가요. 찍은 곳이 들어 있는 스크롤 칸(목록 등)을 기준으로 봐요.</div>
				<div class="hint" id="shot-status" role="status">페이지를 고르고 [화면 불러오기]를 누른 뒤, 누를 곳을 찍으세요.</div>
				<div class="shot" id="shot" hidden><img id="shot-img" alt="페이지 캡처: 누를 곳을 찍으세요" /><div class="dot" id="dot" hidden></div></div>
				<sdpi-item label="X"><sdpi-textfield id="px" setting="pointX" pattern="^[0-9]*$" placeholder="찍으면 채워져요"></sdpi-textfield></sdpi-item>
				<sdpi-item label="Y"><sdpi-textfield id="py" setting="pointY" pattern="^[0-9]*$" placeholder="찍으면 채워져요"></sdpi-textfield></sdpi-item>
			</div>`

		// The plugin answers { event: 'setupShortcut', ok, taskbar, reason } (src/shortcut.ts).
		function setupShortcutButton(client) {
			const status = document.getElementById('shortcut-status')
			const button = document.getElementById('shortcut')
			button.addEventListener('click', () => {
				button.disabled = true
				status.textContent = '만드는 중…'
				client.send('sendToPlugin', { event: 'setupShortcut' })
			})
			client.sendToPropertyInspector.subscribe((ev) => {
				const r = ev.payload
				if (r?.event !== 'setupShortcut') return
				button.disabled = false
				if (!r.ok) return void (status.textContent = r.reason === 'noObs' ? 'OBS를 찾지 못했어요. OBS Studio가 설치되어 있는지 확인하세요.' : '바로가기를 만들지 못했어요. 잠시 뒤 다시 눌러 보세요.')
				status.textContent = "바탕화면·시작 메뉴에 'OBS Studio (Browser Click)'를 만들었어요." + (r.taskbar ? ' 작업 표시줄의 OBS에도 옵션을 붙였어요.' : '') + ' 이제 OBS를 끄고 이 바로가기로 다시 켜세요.'
			})
		}

		async function main() {
			const client = SDPIComponents.streamDeckClient
			const { actionInfo } = await client.getConnectionInfo()
			const custom = actionInfo.action.endsWith('.custom-click')
			const fields = document.getElementById('fields')
			fields.innerHTML = custom ? CUSTOM : REMOTE
			// sdpi-select only sees options added after it is on the page, and fields added from script miss the
			// settings sdpi read at connect: re-add the options and read the settings again once the fields exist.
			for (const s of fields.querySelectorAll('sdpi-select')) s.append(...s.querySelectorAll('option'))
			await Promise.all([...fields.querySelectorAll('[setting]')].map((e) => e.updateComplete))
			const { settings } = await client.getSettings()
			await client.getGlobalSettings()
			setupShortcutButton(client)
			if (!custom) return
			const $ = (id) => document.getElementById(id)
			const askButtons = (pageUrl) => client.send('sendToPlugin', { event: 'getButtons', pageUrl })
			// sdpi-select reports a new value with 'valuechange' on itself; the inner <select>'s 'change' never leaves its shadow root.
			$('page').addEventListener('valuechange', (e) => {
				askButtons(e.target.value)
				$('shot').hidden = true // the old capture belongs to the old page
			})
			$('reload').addEventListener('click', () => {
				client.send('sendToPlugin', { event: 'getPages' })
				askButtons($('page').value)
			})

			const showMode = (mode) => {
				$('by-button').hidden = mode === 'point'
				$('by-point').hidden = mode !== 'point'
			}
			showMode(settings?.mode)
			$('mode').addEventListener('valuechange', (e) => showMode(e.target.value))

			// Capture: the plugin answers { event: 'getShot', ok, data (JPEG base64), width, height } in page pixels.
			let shot
			const placeDot = (x, y) => {
				const ok = shot && x !== '' && y !== '' && !isNaN(x) && !isNaN(y)
				$('dot').hidden = !ok
				if (ok) Object.assign($('dot').style, { left: `${(x / shot.width) * 100}%`, top: `${(y / shot.height) * 100}%` })
			}
			$('shoot').addEventListener('click', () => {
				if (!$('page').value) return void ($('shot-status').textContent = '페이지를 먼저 고르세요.')
				$('shot-status').textContent = '불러오는 중…'
				client.send('sendToPlugin', { event: 'getShot', pageUrl: $('page').value })
			})
			client.sendToPropertyInspector.subscribe(async (ev) => {
				if (ev.payload?.event !== 'getShot') return
				if (!ev.payload.ok) {
					$('shot').hidden = true
					return void ($('shot-status').textContent = '화면을 불러오지 못했어요. OBS가 디버깅 옵션으로 켜져 있고 그 페이지가 열려 있는지 확인하세요.')
				}
				shot = ev.payload
				$('shot-img').src = `data:image/jpeg;base64,${shot.data}`
				$('shot').hidden = false
				$('shot-status').textContent = `페이지 크기 ${shot.width}×${shot.height}. 누를 곳을 찍으세요.`
				const current = (await client.getSettings()).settings
				placeDot(current.pointX, current.pointY)
			})
			// The plugin answers { event: 'restoreScroll', result: 'done' | 'short' | 'noSaved' | 'noPage' | 'noBox' } (restoreScroll in src/actions.ts).
			const RESTORED = {
				done: '찍을 때의 스크롤로 되돌렸어요.',
				short: '페이지가 짧아져서 그 위치까지 못 갔어요. 위치를 다시 찍어 주세요.',
				noSaved: '저장된 스크롤이 없어요. [화면 불러오기]로 위치를 다시 찍어 주세요.',
				noPage: '페이지를 찾지 못했어요. OBS가 디버깅 옵션으로 켜져 있는지 확인하세요.',
				noBox: '찍을 때의 스크롤 칸을 찾지 못했어요. 페이지 화면이 바뀐 것 같아요. 위치를 다시 찍어 주세요.',
			}
			$('restore').addEventListener('click', () => {
				$('shot-status').textContent = '되돌리는 중…'
				client.send('sendToPlugin', { event: 'restoreScroll' })
			})
			client.sendToPropertyInspector.subscribe((ev) => {
				if (ev.payload?.event === 'restoreScroll') $('shot-status').textContent = RESTORED[ev.payload.result] ?? RESTORED.noPage
			})
			$('shot-img').addEventListener('click', async (e) => {
				const img = e.currentTarget
				const x = Math.round((e.offsetX * shot.width) / img.clientWidth)
				const y = Math.round((e.offsetY * shot.height) / img.clientHeight)
				const current = (await client.getSettings()).settings
				// Old scroll values belong to the old point; the plugin saves the new ones (saveScroller in src/actions.ts).
				await client.setSettings({ ...current, pointX: String(x), pointY: String(y), scrollBox: '', scrollX: '', scrollY: '' })
				await client.getSettings() // fills the X and Y fields
				placeDot(x, y)
				$('shot-status').textContent = `위치 ${x},${y}를 저장했어요.`
				client.send('sendToPlugin', { event: 'saveScroller', x, y })
			})
		}
		main()
	</script>
</body>
</html>
